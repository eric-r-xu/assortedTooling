[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stackdown-5-letter-word-finder"
version = "0.1.0"
description = "Screen-based StackDown exposed-tile and five-letter word finder."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mss>=10,<11",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=10,<12",
  "pytesseract>=0.3.13,<0.4",
  "wordfreq>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
stackdown-word-finder = "stackdown_word_finder:main"

[tool.setuptools]
py-modules = ["stackdown_word_finder"]
